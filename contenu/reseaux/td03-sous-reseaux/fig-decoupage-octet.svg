<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="640" height="230" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1a17">126.122.27.0 /28 : découpage du 4e octet</text>

  <!-- trois premiers octets -->
  <rect x="20" y="52" width="250" height="56" rx="8" fill="#eeebe4" stroke="#cdc8bc"/>
  <text x="145" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#1b1a17">126 . 122 . 27</text>
  <text x="145" y="97" text-anchor="middle" font-size="12" fill="#6b6860">partie réseau (/24, fixe)</text>

  <!-- bits de sous-réseau -->
  <g font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">
    <rect x="290" y="52" width="160" height="56" rx="8" fill="#e7ebfc" stroke="#2a4bd7"/>
    <text x="310" y="88" fill="#2a4bd7">1</text>
    <text x="350" y="88" fill="#2a4bd7">0</text>
    <text x="390" y="88" fill="#2a4bd7">0</text>
    <text x="430" y="88" fill="#2a4bd7">1</text>
    <rect x="460" y="52" width="160" height="56" rx="8" fill="#e2f3e8" stroke="#18763f"/>
    <text x="480" y="88" fill="#18763f">0</text>
    <text x="520" y="88" fill="#18763f">0</text>
    <text x="560" y="88" fill="#18763f">1</text>
    <text x="600" y="88" fill="#18763f">1</text>
  </g>

  <!-- poids des bits -->
  <g font-size="11" fill="#6b6860" text-anchor="middle">
    <text x="310" y="126">128</text><text x="350" y="126">64</text><text x="390" y="126">32</text><text x="430" y="126">16</text>
    <text x="480" y="126">8</text><text x="520" y="126">4</text><text x="560" y="126">2</text><text x="600" y="126">1</text>
  </g>

  <!-- légendes -->
  <text x="370" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#2a4bd7">4 bits de sous-réseau</text>
  <text x="370" y="172" text-anchor="middle" font-size="12" fill="#2a4bd7">1001 = sous-réseau n° 9 → 144</text>
  <text x="540" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#18763f">4 bits d'hôte</text>
  <text x="540" y="172" text-anchor="middle" font-size="12" fill="#18763f">0011 = machine n° 3</text>

  <text x="320" y="212" text-anchor="middle" font-size="14" fill="#1b1a17">128 + 16 + 2 + 1 = <tspan font-weight="700">147</tspan>  →  adresse 126.122.27.147  (masque 255.255.255.240)</text>
</svg>
